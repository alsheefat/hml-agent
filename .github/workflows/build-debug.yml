name: Build Debug Apk

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the GitHub Release the app downloads its updates from.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hml-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hml-agent.apk

      # Only runs after a SUCCESSFUL build. The app checks the latest release and offers
      # "Update" to the user. Tag format build-<run number> is what the app expects.
      - name: Publish release for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HML Agent build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          files: hml-agent.apk
          make_latest: true
          prerelease: false
