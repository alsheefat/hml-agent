name: Build Debug Apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish HML-Agent-v1.5.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Normalize APK filename
        shell: bash
        run: |
          set -e
          OUT="app/build/outputs/apk/debug"
          if [ -f "$OUT/app-debug.apk" ]; then
            mv -f "$OUT/app-debug.apk" "$OUT/HML-Agent-v1.5.apk"
          fi
          test -f "$OUT/HML-Agent-v1.5.apk"
          rm -f "$OUT/app-debug.apk"
          echo "Final APK:"
          ls -lah "$OUT"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hml-agent-debug-apk
          path: app/build/outputs/apk/debug/HML-Agent-v1.5.apk
          if-no-files-found: error
          retention-days: 30
